<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Subtle background container -->
  <rect x="4" y="8" width="232" height="84" rx="12" fill="#ffffff" fill-opacity="0.0" stroke="#e2e8f0" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Stylized ARC Symbol: Dynamic Arcs -->
  <g transform="translate(18, 22)">
    <!-- Outer Arc -->
    <path d="M 12 44 A 28 28 0 0 1 52 14" fill="none" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Inner Arc -->
    <path d="M 22 44 A 18 18 0 0 1 48 24" fill="none" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Central Node -->
    <circle cx="48" cy="44" r="5" fill="#0284c7" />
    <circle cx="52" cy="14" r="3.5" fill="#38bdf8" />
  </g>
  
  <!-- Typography -->
  <g transform="translate(86, 0)">
    <text x="0" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#0f172a" letter-spacing="2.5">
      ARC
    </text>
    <!-- Highlight dot -->
    <circle cx="88" cy="36" r="4" fill="#0284c7" />
    <text x="2" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#64748b" letter-spacing="1.2">
      RESEARCH &amp; INNOVATION
    </text>
  </g>
</svg>
